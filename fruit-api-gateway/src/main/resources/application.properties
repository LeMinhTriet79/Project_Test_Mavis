spring.application.name=fruit-api-gateway
server.port=8080

# Spring Cloud Gateway & Downstream Route Declarations for MAVIS Config Detector
spring.cloud.gateway.routes[0].id=fruit-order-route
spring.cloud.gateway.routes[0].uri=http://fruit-order-service:8081/api/orders
spring.cloud.gateway.routes[1].id=fruit-catalog-route
spring.cloud.gateway.routes[1].uri=http://fruit-catalog-service:8082/api/fruits
spring.cloud.gateway.routes[2].id=fruit-pricing-route
spring.cloud.gateway.routes[2].uri=http://fruit-pricing-service:8084/api/pricing

# OpenFeign Client URL Bindings
spring.cloud.openfeign.client.config.fruit-order-service.url=http://fruit-order-service:8081
spring.cloud.openfeign.client.config.fruit-catalog-service.url=http://fruit-catalog-service:8082
