spring.application.name=fruit-order-service
server.port=8081

# Default Local H2 Database (so mvn spring-boot:run works immediately without installing Postgres)
spring.datasource.url=jdbc:h2:mem:fruit_order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Downstream Service URLs for MAVIS SpringConfigDetectorService & FeignCommunicationResolver
spring.cloud.openfeign.client.config.fruit-catalog-service.url=http://fruit-catalog-service:8082
spring.cloud.openfeign.client.config.fruit-pricing-service.url=http://fruit-pricing-service:8084
spring.cloud.openfeign.client.config.fruit-delivery-service.url=http://fruit-delivery-service:8085
payment.service.url=http://fruit-payment-service:8083/api/payments/charge
pricing.service.url=http://fruit-pricing-service:8084/api/pricing/quote
delivery.service.url=http://fruit-delivery-service:8085/api/deliveries/dispatch
