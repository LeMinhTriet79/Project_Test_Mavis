version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    container_name: fruit-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CATALOG_SERVICE_URL=http://fruit-catalog-service:8081
      - ORDER_SERVICE_URL=http://fruit-order-service:8083
      - DELIVERY_SERVICE_URL=http://fruit-delivery-service:8085
    depends_on:
      - fruit-catalog-service
      - fruit-order-service
      - fruit-delivery-service

  fruit-catalog-service:
    build: ./fruit-catalog-service
    container_name: fruit-catalog-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://catalog-db:5432/fruit_catalog_db
      - INVENTORY_SERVICE_URL=http://fruit-inventory-service:8082
    depends_on:
      - catalog-db
      - fruit-inventory-service

  fruit-inventory-service:
    build: ./fruit-inventory-service
    container_name: fruit-inventory-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://inventory-db:5432/fruit_inventory_db
    depends_on:
      - inventory-db

  fruit-order-service:
    build: ./fruit-order-service
    container_name: fruit-order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/fruit_order_db
      - CATALOG_SERVICE_URL=http://fruit-catalog-service:8081
      - INVENTORY_SERVICE_URL=http://fruit-inventory-service:8082
      - PAYMENT_SERVICE_URL=http://fruit-payment-service:8084
      - DELIVERY_SERVICE_URL=http://fruit-delivery-service:8085
    depends_on:
      - order-db
      - fruit-catalog-service
      - fruit-inventory-service
      - fruit-payment-service
      - fruit-delivery-service

  fruit-payment-service:
    build: ./fruit-payment-service
    container_name: fruit-payment-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment-db:5432/fruit_payment_db
      - NOTIFICATION_SERVICE_URL=http://fruit-notification-service:8086
    depends_on:
      - payment-db
      - fruit-notification-service

  fruit-delivery-service:
    build: ./fruit-delivery-service
    container_name: fruit-delivery-service
    ports:
      - "8085:8085"
    environment:
      - NOTIFICATION_SERVICE_URL=http://fruit-notification-service:8086
    depends_on:
      - fruit-notification-service

  fruit-notification-service:
    build: ./fruit-notification-service
    container_name: fruit-notification-service
    ports:
      - "8086:8086"
    environment:
      - SMTP_HOST=smtp.mekongfruit.vn

  catalog-db:
    image: postgres:15-alpine
    container_name: fruit-catalog-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=fruit_catalog_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  inventory-db:
    image: postgres:15-alpine
    container_name: fruit-inventory-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=fruit_inventory_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  order-db:
    image: postgres:15-alpine
    container_name: fruit-order-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=fruit_order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  payment-db:
    image: postgres:15-alpine
    container_name: fruit-payment-db
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=fruit_payment_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
